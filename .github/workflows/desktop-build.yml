name: desktop-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos
          - os: windows-2022
            artifact: windows
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: scripts/build_macos_app.sh
      - name: Build Windows/Linux application
        if: runner.os != 'macOS'
        run: pyside6-deploy src/lecture_auto/gui/app.py --name LectureAuto --force --keep-deployment-files
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find . -name 'LectureAuto.app' -print -quit)
          test -n "$APP"
          mkdir -p dist-release
          hdiutil create -volname "Lecture Auto" -srcfolder "$APP" -ov -format UDZO dist-release/LectureAuto.dmg
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $built = Get-ChildItem -Recurse -Filter LectureAuto.exe | Select-Object -First 1
          if (-not $built) { throw "LectureAuto.exe not found" }
          New-Item -ItemType Directory -Force dist/LectureAuto | Out-Null
          Copy-Item $built.Directory.FullName/* dist/LectureAuto -Recurse -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" deployment/windows.iss
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          built=$(find . -type f -name LectureAuto -perm -111 -print -quit)
          test -n "$built"
          mkdir -p LectureAuto.AppDir/usr/bin dist-release
          cp -a "$(dirname "$built")"/* LectureAuto.AppDir/usr/bin/
          printf '#!/bin/sh\nexec "$APPDIR/usr/bin/LectureAuto" "$@"\n' > LectureAuto.AppDir/AppRun
          chmod +x LectureAuto.AppDir/AppRun
          curl -L -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage --appdir LectureAuto.AppDir --output appimage
          mv ./*.AppImage dist-release/LectureAuto.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: lecture-auto-${{ matrix.artifact }}
          path: |
            dist-release/*
            dist-installer/*
