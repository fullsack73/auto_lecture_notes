name: desktop-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos
          - os: windows-2022
            artifact: windows
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          patchelf python3-dev libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1
          libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: scripts/build_macos_app.sh
      - name: Build Windows application and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows_app.ps1 -Installer
      - name: Build Linux application and AppImage
        if: runner.os == 'Linux'
        run: bash scripts/build_linux_app.sh --appimage
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find . -name 'LectureAuto.app' -print -quit)
          test -n "$APP"
          mkdir -p dist-release
          hdiutil create -volname "Lecture Auto" -srcfolder "$APP" -ov -format UDZO dist-release/LectureAuto.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: lecture-auto-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist-release/*
            dist-installer/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: lecture-auto-windows
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: lecture-auto-linux
          path: release-assets
      - name: Flatten release assets
        run: |
          find release-assets -mindepth 2 -type f -exec mv --target-directory=release-assets {} +
          find release-assets -mindepth 1 -type d -empty -delete
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --title "Lecture Auto $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
