name: desktop-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos
          - os: windows-2022
            artifact: windows
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          patchelf python3-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1
          libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: scripts/build_macos_app.sh
      - name: Build Windows application and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows_app.ps1 -Installer
      - name: Build Linux application and AppImage
        if: runner.os == 'Linux'
        run: bash scripts/build_linux_app.sh --appimage
      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find . -name 'LectureAuto.app' -print -quit)
          test -n "$APP"
          mkdir -p dist-release
          hdiutil create -volname "Lecture Auto" -srcfolder "$APP" -ov -format UDZO dist-release/LectureAuto.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: lecture-auto-${{ matrix.artifact }}
          path: |
            dist-release/*
            dist-installer/*
